name: HyperOS 2 Ultimate Unified Extractor
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |  
          sudo apt-get update && sudo apt-get install -y aria2 p7zip-full cpio erofs-utils
          wget https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz  
          tar -xf payload-dumper-go_1.2.2_linux_amd64.tar.gz  
          sudo cp payload-dumper-go /usr/local/bin/  
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk -O magisk.zip
          unzip -q magisk.zip 'lib/x86_64/libmagiskboot.so'
          sudo mv lib/x86_64/libmagiskboot.so /usr/local/bin/magiskboot
          sudo chmod +x /usr/local/bin/magiskboot

      - name: Fast Download ROM  
        run: |  
          aria2c -x 16 -s 16 -k 1M --file-allocation=none --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o rom.zip "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global-ota_full-OS2.0.208.0.VGQINXM-user-15.0-93391672cc.zip"
          unzip -q rom.zip payload.bin && rm -f rom.zip

      - name: Dump Partitions
        run: |  
          payload-dumper-go -o dumped_images -p vendor_boot,vendor_dlkm,dtbo payload.bin  
          rm -f payload.bin  

      - name: Extract Configs & Prebuilts
        run: |  
          mkdir -p extracted_assets/prebuilt extracted_assets/configs
          
          # 1. Save dtbo.img and vendor_boot.img for the prebuilt folder
          cp dumped_images/dtbo.img extracted_assets/prebuilt/ || true
          cp dumped_images/vendor_boot.img extracted_assets/prebuilt/ || true

          cd dumped_images
          
          # 2. Get the .rc files using magiskboot to avoid cpio crashes
          magiskboot unpack vendor_boot.img || true
          if [ -f ramdisk.cpio ]; then
            mkdir ramdisk_extracted && cd ramdisk_extracted
            magiskboot cpio ../ramdisk.cpio extract || true
            find . -name "*.rc" -exec cp {} ../../extracted_assets/configs/ \; || true
            cd ..
          fi

          # 3. Get the load order from vendor_dlkm (EROFS)
          fsck.erofs --extract=vendor_dlkm_extracted vendor_dlkm.img || true
          if [ -d vendor_dlkm_extracted ]; then
            find vendor_dlkm_extracted -name "modules.load*" -exec cp {} ../extracted_assets/configs/ \; || true
          fi

      - name: Upload Config & Prebuilt Artifacts  
        uses: actions/upload-artifact@v4  
        with:  
          name: HyperOS2-Unified-Assets  
          path: extracted_assets/**/*
