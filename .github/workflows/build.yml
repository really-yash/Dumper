name: HyperOS 2 Cloud Extractor
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Install Dependencies & Tools  
        run: |  
          sudo apt-get update && sudo apt-get install -y aria2 p7zip-full cpio
          wget https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz  
          tar -xf payload-dumper-go_1.2.2_linux_amd64.tar.gz  
          sudo cp payload-dumper-go /usr/local/bin/  

      - name: Fast Download HyperOS 2 ROM  
        run: |  
          aria2c -x 16 -s 16 -k 1M --file-allocation=none --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o rom.zip "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS2.0.208.0.VGQINXM/air_in_global-ota_full-OS2.0.208.0.VGQINXM-user-15.0-93391672cc.zip"

      - name: Extract payload.bin  
        run: |  
          unzip -q rom.zip payload.bin  
          rm -f rom.zip  

      - name: Dump Target Partition (vendor_dlkm)  
        run: |  
          payload-dumper-go -o dumped_images -p vendor_dlkm payload.bin  
          rm -f payload.bin  

      - name: Extract Touch Modules from vendor_dlkm  
        run: |  
          mkdir -p extracted_assets/modules
          
          cd dumped_images  
          # Extract vendor_dlkm partition
          7z x vendor_dlkm.img -ovendor_dlkm_extracted -y || true  
          if [ -d vendor_dlkm_extracted ]; then  
            find vendor_dlkm_extracted -name "*.ko" -exec cp {} ../extracted_assets/modules/ \;  
          fi  
            
          cd ..  
          rm -rf dumped_images  

      - name: Upload DLKM Modules Artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: HyperOS2-A15-Touch-Modules  
          path: extracted_assets/**/*
