name: HyperOS 2 Custom Dumper
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Install payload-dumper-go
        run: |
          wget https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
          tar -xf payload-dumper-go_1.2.2_linux_amd64.tar.gz
          sudo cp payload-dumper-go /usr/local/bin/

      - name: Download HyperOS 2 ROM
        run: |
          wget -q -O rom.zip "https://bigota.d.miui.com/OS2.0.207.0.VGQINXM/air_in_global-ota_full-OS2.0.207.0.VGQINXM-user-15.0-eba6e3654a.zip"

      - name: Extract payload.bin & Clean Up
        run: |
          unzip rom.zip payload.bin
          rm rom.zip # Deleting the zip immediately to save 5GB of runner storage!

      - name: Dump Golden Partitions
        run: |
          payload-dumper-go -o dumped_images -p boot,init_boot,vendor_boot,vendor,odm,dtbo payload.bin

      - name: Upload Images as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS2-Golden-Images
          path: dumped_images/*.img
